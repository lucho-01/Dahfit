# Perfil de tests: no toca Neon ni ninguna base real.
# El esquema y la semilla vienen de schema.sql/data.sql (equivalente H2 de las
# migraciones V1-V6); Flyway queda apagado porque parte del DDL de PostgreSQL
# (indice parcial) no existe en H2.
spring:
  datasource:
    url: jdbc:h2:mem:dafit;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  flyway:
    enabled: false

dafit:
  database:
    # La verificacion real de la base es cosa de produccion: aqui solo se
    # quiere el contexto arriba.
    verify-on-startup: false
