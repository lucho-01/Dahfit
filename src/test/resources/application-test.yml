# Perfil de tests: no toca Neon ni ninguna base real.
# Los adaptadores siguen siendo en memoria; el datasource se declara solo para
# que la auto-configuracion de JPA/Flyway no intente resolver hosts.
spring:
  datasource:
    url: jdbc:h2:mem:dafit;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

dafit:
  database:
    # La verificacion real de la base es cosa de produccion: en tests, H2 va
    # sin Flyway y sin las tablas, asi que el chequeo fallaria antes de empezar.
    verify-on-startup: false
