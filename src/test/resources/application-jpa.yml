# Perfil de integracion de persistencia: valida los adaptadores JDBC reales
# contra el esquema (schema.sql/data.sql) sin depender de una base externa ni
# de Docker.
#
# Diferencias deliberadas con produccion:
#   * El esquema lo crean schema.sql/data.sql en vez de Flyway, porque parte
#     del DDL de PostgreSQL (indice parcial de workouts) no existe en H2. El
#     DDL real de PostgreSQL se valida con Flyway al arrancar contra Neon.
#   * H2 en modo PostgreSQL, para que los tipos y el SQL se parezcan.
spring:
  datasource:
    url: jdbc:h2:mem:dafit-jpa;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  flyway:
    enabled: false

dafit:
  database:
    verify-on-startup: false
