spring:
  datasource:
    url: jdbc:h2:mem:dafit-jpa;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

dafit:
  database:
    verify-on-startup: false
